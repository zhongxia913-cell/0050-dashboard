# ============================================================
# 放置位置：repo 根目錄的  .github/workflows/update-data.yml
# 用途：每天台灣時間 19:00 抓最新行情 → 更新 data/stock_data.rds
#       → 自動 commit & push（Posit Connect 會據此重新部署）
# ============================================================

name: Update 0050 stock data

on:
  schedule:
    # UTC 11:00 = 台灣 19:00。GitHub 排程可能延遲 5～30 分鐘，屬正常。
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      reinstall_packages:
        description: "強制重新安裝 R 套件（套件壞掉時勾選）"
        type: boolean
        default: false

permissions:
  contents: write

# 兩支 workflow 必須共用同一個 group，否則會同時改同一個 binary 檔而衝突
concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Taipei
      R_KEEP_PKG_SOURCE: "no"

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1-1. 同步遠端最新資料
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: 2. Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          # 用最新穩定版；若哪天 tidyquant 在新 R 版裝不起來，把 release 改成 4.4.1
          r-version: "release"
          # 使用 Posit 的 Linux 預編譯套件：安裝時間從 10 分鐘降到 1 分鐘左右
          use-public-rspm: true

      - name: 3. 快取 R 套件
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-release-${{ inputs.reinstall_packages && github.run_id || 'v1' }}
          restore-keys: |
            ${{ runner.os }}-r-release-

      - name: 4. 安裝 R 套件
        shell: Rscript {0}
        run: |
          pkgs <- c("tidyquant", "dplyr", "readr", "lubridate",
                    "purrr", "stringr", "httr2", "jsonlite")
          need <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(need) > 0) install.packages(need)
          ok <- vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)
          if (!all(ok)) stop("套件安裝失敗：", paste(pkgs[!ok], collapse = ", "))
          cat("套件 OK：", paste(pkgs, collapse = ", "), "\n")

      - name: 5. 執行資料更新
        run: Rscript update_data.R

      # 沒有這一步，抓不到資料時 workflow 還是會顯示綠色成功
      - name: 6. 驗證產出
        shell: Rscript {0}
        run: |
          f <- "data/stock_data.rds"
          if (!file.exists(f)) stop("找不到 ", f)

          d <- readRDS(f)
          if (!is.data.frame(d)) stop("stock_data.rds 不是 data.frame")

          need <- c("symbol", "date", "open", "high", "low", "close", "volume", "adjusted")
          miss <- setdiff(need, names(d))
          if (length(miss) > 0) stop("缺少欄位：", paste(miss, collapse = ", "))

          if (!"0050" %in% d$symbol) stop("資料中沒有 0050")
          if (any(!is.finite(d$adjusted))) warning("adjusted 有非有限值")

          latest <- max(d$date, na.rm = TRUE)
          cat(sprintf("筆數 %d｜檔數 %d｜最新交易日 %s\n",
                      nrow(d), length(unique(d$symbol)), format(latest)))

          if (latest < Sys.Date() - 7) {
            stop("資料已超過 7 天未更新，請看第 5 步的錯誤訊息")
          }

      - name: 7. 執行摘要
        if: always()
        run: |
          {
            echo "## 資料更新結果"
            echo ""
            echo "- 狀態：${{ job.status }}"
            echo "- 時間：$(date '+%Y-%m-%d %H:%M:%S')（Asia/Taipei）"
            echo "- 觸發：${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 8. Commit & Push
        run: |
          set -e
          BR="${GITHUB_REF_NAME}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # rds 是 binary，git 無法 merge。先把這次算好的檔案備份到 /tmp，
          # 衝突時直接整檔取用我們這份，不讓 git 去合併。
          mkdir -p /tmp/out
          if [ -f data/stock_data.rds ]; then cp data/stock_data.rds /tmp/out/; fi
          if [ -f data/data_meta.json ]; then cp data/data_meta.json /tmp/out/; fi
          if [ -f dashboard/data/stock_data.csv ]; then cp dashboard/data/stock_data.csv /tmp/out/; fi

          pushed=0
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"      # 換成遠端最新程式碼，丟掉任何衝突狀態

            cp /tmp/out/stock_data.rds data/stock_data.rds
            if [ -f /tmp/out/data_meta.json ]; then cp /tmp/out/data_meta.json data/data_meta.json; fi
            if [ -f /tmp/out/stock_data.csv ]; then cp /tmp/out/stock_data.csv dashboard/data/stock_data.csv; fi

            git add -f data/stock_data.rds
            if [ -f data/data_meta.json ]; then git add -f data/data_meta.json; fi
            if [ -f dashboard/data/stock_data.csv ]; then git add -f dashboard/data/stock_data.csv; fi

            if git diff --cached --quiet; then
              echo "資料沒有變更，略過 commit"
              exit 0
            fi

            git commit -m "chore(data): 自動更新行情 $(date '+%Y-%m-%d %H:%M') TPE"

            if git push origin "HEAD:$BR"; then
              pushed=1
              break
            fi

            echo "第 $i 次 push 失敗（遠端又被推過），重新同步後重試"
            sleep $((i * 5))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "push 失敗：請檢查 Workflow permissions 是否為 Read and write"
            exit 1
          fi
